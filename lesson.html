<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lesson — ENOVA Dev</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/lesson.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
</head>
<body>

<header class="lesson-topbar">
  <div class="lesson-topbar-left">
    <a href="dashboard.html" class="back-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <a href="index.html" class="nav-logo" style="font-size:16px">ENOVA<span>.</span>dev</a>
    <div class="lesson-breadcrumb"><span id="trackLabel">HTML</span><span style="color:var(--text-3)">›</span><span id="lessonTitle">Loading...</span></div>
  </div>
  <div class="lesson-topbar-right">
    <div class="lesson-xp-badge" id="lessonXP">+100 XP</div>
    <button class="btn-primary run-btn" id="runBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Run</button>
    <button class="btn-ghost check-btn" id="checkBtn">Check Solution</button>
    <a href="dashboard.html" class="btn-ghost" style="font-size:13px;padding:8px 16px;">Dashboard</a>
  </div>
</header>

<div class="lesson-layout">
  <aside class="theory-panel">
    <div class="theory-inner">
      <div class="theory-badge" id="theoryObjective"></div>
      <h2 class="theory-title" id="theoryTitle">Loading...</h2>
      <div class="theory-body" id="theoryBody"></div>
      <div class="task-box">
        <div class="task-header"><span class="task-icon">🎯</span><span>Your Task</span></div>
        <p class="task-desc" id="taskDesc">Loading task...</p>
        <div class="hints-section" id="hintsSection"></div>
      </div>
      <div class="lesson-nav">
        <button class="btn-ghost lesson-nav-btn" id="prevBtn">← Previous</button>
        <button class="btn-primary lesson-nav-btn" id="nextBtn">Next →</button>
      </div>
    </div>
  </aside>

  <div class="editor-panel">
    <div class="editor-topbar">
      <div class="editor-tabs"><div class="editor-tab active">index.html</div></div>
      <div class="editor-actions">
        <button class="editor-action-btn" id="resetBtn">↺ Reset</button>
        <button class="editor-action-btn" id="copyBtn">⎘ Copy</button>
      </div>
    </div>
    <textarea id="codeEditor"></textarea>
  </div>

  <div class="right-panel">
    <div class="preview-panel">
      <div class="panel-header">
        <span class="panel-title"><span class="panel-dot" style="background:var(--green)"></span>Live Preview</span>
        <button class="editor-action-btn" id="refreshBtn">↺</button>
      </div>
      <div class="preview-frame-wrap"><iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" title="Preview"></iframe></div>
    </div>
    <div class="ai-panel">
      <div class="panel-header">
        <span class="panel-title"><span class="panel-dot ai-dot"></span>ENOVA AI Tutor</span>
        <button class="editor-action-btn" id="clearChatBtn">✕ Clear</button>
      </div>
      <div class="ai-messages" id="aiMessages">
        <div class="ai-msg ai-msg-bot">
          <div class="ai-msg-avatar">AI</div>
          <div class="ai-msg-bubble">Hey! I'm your ENOVA AI tutor 👋<br/>Ask me anything, type <strong>/hint</strong> for a clue, or ask me to write code!</div>
        </div>
      </div>
      <div class="ai-input-row">
        <input class="ai-input" id="aiInput" placeholder="Ask anything or type /hint..." type="text"/>
        <button class="ai-send-btn" id="aiSendBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="successModal" style="display:none">
  <div class="modal-card">
    <div class="modal-icon">🎉</div>
    <h2 class="modal-title">Lesson Complete!</h2>
    <p class="modal-sub" id="modalSub">You earned XP!</p>
    <div class="modal-xp" id="modalXP">+100 XP</div>
    <div class="modal-actions">
      <button class="btn-primary" id="modalNextBtn">Next Lesson →</button>
      <a href="dashboard.html" class="btn-ghost">Dashboard</a>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { CURRICULUM, TRACKS, getAllLessons, getLessonById } from "./js/app.js";

  // ── State ─────────────────────────────────────────────────────
  let editor = null;
  let lesson = null;
  let currentUser = null;
  let completedLessons = [];
  let aiHistory = [];
  let aiSending = false;

  // ── Toast ─────────────────────────────────────────────────────
  function toast(msg, type) {
    const el = document.createElement("div");
    el.className = "toast toast-" + (type||"info");
    el.innerHTML = "<span>" + msg + "</span>";
    document.getElementById("toastContainer").appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  // ── Auth ──────────────────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) completedLessons = snap.data().completedLessons || [];
    } catch(e) { console.error(e); }
    const id = new URLSearchParams(window.location.search).get("id") || "html-1";
    loadLesson(getLessonById(id) || getLessonById("html-1"));
    bindButtons();
  });

  // ── Bind ──────────────────────────────────────────────────────
  function bindButtons() {
    document.getElementById("runBtn").onclick = runCode;
    document.getElementById("checkBtn").onclick = checkSolution;
    document.getElementById("resetBtn").onclick = resetCode;
    document.getElementById("copyBtn").onclick = copyCode;
    document.getElementById("refreshBtn").onclick = runCode;
    document.getElementById("prevBtn").onclick = goPrev;
    document.getElementById("nextBtn").onclick = goNext;
    document.getElementById("modalNextBtn").onclick = goNext;
    document.getElementById("aiSendBtn").onclick = sendAI;
    document.getElementById("clearChatBtn").onclick = clearChat;
    document.getElementById("aiInput").onkeydown = e => { if (e.key === "Enter") sendAI(); };
  }

  // ── Load lesson ───────────────────────────────────────────────
  function loadLesson(lsn) {
    lesson = lsn;
    const tk = lsn.id.split("-")[0];
    const track = CURRICULUM[tk];
    const all = getAllLessons();
    const idx = all.findIndex(l => l.id === lsn.id);

    document.getElementById("trackLabel").textContent = track.label;
    document.getElementById("lessonTitle").textContent = lsn.title;
    document.getElementById("theoryTitle").textContent = lsn.title;
    document.getElementById("theoryObjective").textContent = lsn.objective;
    document.getElementById("theoryBody").innerHTML = lsn.theory;
    document.getElementById("taskDesc").textContent = lsn.task;
    document.getElementById("lessonXP").textContent = "+" + lsn.xp + " XP";
    document.getElementById("modalSub").textContent = "You earned +" + lsn.xp + " XP";
    document.getElementById("modalXP").textContent = "+" + lsn.xp + " XP";
    document.title = lsn.title + " — ENOVA Dev";

    document.getElementById("hintsSection").innerHTML =
      lsn.hints.map(h => '<div class="hint-item">💡 ' + h + '</div>').join("");

    document.getElementById("prevBtn").disabled = idx === 0;
    document.getElementById("nextBtn").textContent = idx === all.length - 1 ? "Finish 🎓" : "Next →";

    const isDone = completedLessons.includes(lsn.id);
    const btn = document.getElementById("checkBtn");
    btn.textContent = isDone ? "✓ Completed" : "Check Solution";
    btn.style.borderColor = isDone ? "var(--green)" : "";
    btn.style.color = isDone ? "var(--green)" : "";

    window.history.replaceState({}, "", "?id=" + lsn.id);
    initEditor(lsn.starter);

    // Reset AI chat for new lesson
    aiHistory = [];
    document.getElementById("aiMessages").innerHTML = "";
    addMsg("Loaded: **" + lsn.title + "**\n\n" + lsn.objective + "\n\nAsk me anything or type /hint!", "bot");
  }

  // ── Editor ────────────────────────────────────────────────────
  function initEditor(code) {
    if (editor) {
      editor.setValue(code);
      setTimeout(() => { editor.refresh(); runCode(); }, 100);
      return;
    }
    editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
      mode: "htmlmixed",
      lineNumbers: true,
      matchBrackets: true,
      autoCloseTags: true,
      indentUnit: 2,
      tabSize: 2,
      lineWrapping: true,
      extraKeys: { "Ctrl-Enter": runCode, "Cmd-Enter": runCode }
    });
    editor.setValue(code);
    editor.on("change", () => {
      clearTimeout(window._ar);
      window._ar = setTimeout(() => { runCode(); updateCheckBtn(); }, 800);
    });
    setTimeout(() => { editor.refresh(); runCode(); }, 200);
  }

  function runCode() {
    if (!editor) return;
    try {
      const fr = document.getElementById("previewFrame");
      const d = fr.contentDocument || fr.contentWindow.document;
      d.open(); d.write(editor.getValue()); d.close();
    } catch(e) { console.warn(e); }
    updateCheckBtn();
  }

  function updateCheckBtn() {
    if (!lesson || completedLessons.includes(lesson.id)) return;
    const passes = !lesson.check || lesson.check(editor.getValue());
    const btn = document.getElementById("checkBtn");
    btn.textContent = passes ? "✓ Ready to Submit!" : "Check Solution";
    btn.style.borderColor = passes ? "var(--cyan)" : "";
    btn.style.color = passes ? "var(--cyan)" : "";
  }

  function resetCode() {
    if (!lesson || !confirm("Reset to starter code?")) return;
    editor.setValue(lesson.starter); runCode();
  }

  function copyCode() {
    navigator.clipboard.writeText(editor.getValue()).then(() => toast("Copied!", "success"));
  }

  // ── Check solution ────────────────────────────────────────────
  async function checkSolution() {
    if (!lesson || !currentUser) return;
    const code = editor.getValue();

    if (lesson.check && !lesson.check(code)) {
      toast("Not quite! Asking AI to help...", "error");
      aiHistory.push({ role:"user", content:"I clicked Check Solution but my code failed. Task: " + lesson.task + "\n\nMy code:\n```html\n" + code + "\n```\nExplain exactly what is wrong and guide me to fix it." });
      await callAI();
      return;
    }

    // Save to Firestore
    try {
      const ref = doc(db, "users", currentUser.uid);
      const snap = await getDoc(ref);
      const data = snap.exists() ? snap.data() : {};
      const done = data.completedLessons || [];
      if (!done.includes(lesson.id)) {
        const newXP = (data.xp || 0) + lesson.xp;
        await setDoc(ref, {
          completedLessons: [...done, lesson.id],
          xp: newXP,
          level: Math.floor(newXP / 500) + 1,
          lastActiveDate: serverTimestamp()
        }, { merge: true });
        completedLessons = [...done, lesson.id];
      }
    } catch(e) { console.error("Save error:", e); }

    document.getElementById("successModal").style.display = "flex";
    const btn = document.getElementById("checkBtn");
    btn.textContent = "✓ Completed";
    btn.style.borderColor = "var(--green)";
    btn.style.color = "var(--green)";
    toast("+" + lesson.xp + " XP earned! 🎉", "success");
    addMsg("🎉 **Lesson Complete!** You earned **+" + lesson.xp + " XP**!\n\nYou mastered: " + lesson.objective + "\n\nClick **Next →** when ready!", "bot");
  }

  // ── Nav ───────────────────────────────────────────────────────
  function goPrev() {
    const all = getAllLessons();
    const idx = all.findIndex(l => l.id === lesson.id);
    if (idx > 0) loadLesson(all[idx - 1]);
  }
  function goNext() {
    document.getElementById("successModal").style.display = "none";
    const all = getAllLessons();
    const idx = all.findIndex(l => l.id === lesson.id);
    if (idx < all.length - 1) loadLesson(all[idx + 1]);
    else window.location.href = "certificate.html";
  }

  // ── AI ────────────────────────────────────────────────────────
  function addMsg(text, role) {
    const c = document.getElementById("aiMessages");
    const w = document.createElement("div");
    w.className = "ai-msg ai-msg-" + (role === "bot" ? "bot" : "user");
    const fmt = text.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br/>");
    w.innerHTML = role === "bot"
      ? '<div class="ai-msg-avatar">AI</div><div class="ai-msg-bubble">' + fmt + '</div>'
      : '<div class="ai-msg-bubble ai-msg-user-bubble">' + fmt + '</div>';
    c.appendChild(w);
    c.scrollTop = c.scrollHeight;
  }

  async function callAI() {
    if (aiSending) return;
    aiSending = true;
    document.getElementById("aiSendBtn").disabled = true;

    // Typing indicator
    const c = document.getElementById("aiMessages");
    const typing = document.createElement("div");
    typing.id = "aiTyping";
    typing.className = "ai-msg ai-msg-bot";
    typing.innerHTML = '<div class="ai-msg-avatar">AI</div><div class="ai-msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    c.appendChild(typing); c.scrollTop = c.scrollHeight;

    const code = editor ? editor.getValue() : "";
    const sys = "You are ENOVA Dev AI, a coding tutor for beginners learning HTML, CSS and JavaScript.\n\nLesson: \"" + (lesson ? lesson.title : "") + "\"\nTask: " + (lesson ? lesson.task : "") + "\n\nStudent code:\n```html\n" + code + "\n```\n\nRULES:\n- Analyze the code, explain what's wrong/missing clearly\n- If student needs code help, provide ONE code block:\n```html\n<code>\n```\n(App will auto-inject it into editor)\n- Keep under 200 words\n- Be encouraging\n- If code looks correct, tell them to click Check Solution";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ systemPrompt: sys, messages: aiHistory })
      });
      const data = await res.json();
      document.getElementById("aiTyping")?.remove();
      const reply = data.reply || data.error || "Something went wrong.";
      aiHistory.push({ role:"assistant", content: reply });

      // Inject code block into editor if present
      const cm = reply.match(/```(?:html|css|js|javascript)?\n([\s\S]*?)```/);
      if (cm && editor) {
        editor.setValue(cm[1].trim());
        setTimeout(runCode, 200);
        toast("AI wrote code to editor ✨", "info");
      }
      const display = cm
        ? reply.replace(/```(?:html|css|js|javascript)?\n[\s\S]*?```/g, "✏️ <em>Code written to editor ↑</em>")
        : reply;
      addMsg(display, "bot");
    } catch(e) {
      document.getElementById("aiTyping")?.remove();
      addMsg("Connection error: " + e.message, "bot");
    }

    aiSending = false;
    document.getElementById("aiSendBtn").disabled = false;
  }

  async function sendAI() {
    const input = document.getElementById("aiInput");
    const msg = input.value.trim();
    if (!msg) return;
    input.value = "";

    if (msg.toLowerCase() === "/hint") {
      addMsg("/hint", "user");
      const h = lesson.hints[Math.floor(Math.random() * lesson.hints.length)];
      addMsg("Here's a hint 💡\n\n**" + h + "**", "bot");
      return;
    }

    addMsg(msg, "user");
    aiHistory.push({ role:"user", content: msg });
    await callAI();
  }

  function clearChat() {
    document.getElementById("aiMessages").innerHTML = "";
    aiHistory = [];
    addMsg("Chat cleared! Ask me anything 👋", "bot");
  }
</script>
</body>
</html>
