<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certificate — ENOVA Dev</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/dashboard.css"/>
  <link rel="stylesheet" href="css/certificate.css"/>
</head>
<body>

<aside class="sidebar">
  <a href="index.html" class="nav-logo sidebar-logo">ENOVA<span>.</span>dev</a>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="lesson.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Lessons
    </a>
    <a href="profile.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
    <a href="certificate.html" class="sidebar-link active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
      Certificate
    </a>
  </nav>
  <button class="sidebar-logout" id="logoutBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Sign Out
  </button>
</aside>

<main class="dash-main">
  <div class="dash-header">
    <div>
      <p class="dash-greeting">Your Certificates</p>
      <h1 class="dash-name">Hall of Achievement</h1>
    </div>
  </div>

  <div class="section-label">Track Completion</div>
  <div class="cert-track-status" id="certTrackStatus"></div>
  <div class="cert-locked-msg" id="certLockedMsg" style="display:none">
    <div class="cert-locked-icon">🔒</div>
    <h3>Complete all lessons to unlock your certificate</h3>
    <p>Finish all HTML, CSS, and JavaScript tracks to earn your certificate.</p>
    <a href="lesson.html" class="btn-primary" style="margin-top:16px">Continue Learning →</a>
  </div>

  <div id="certSection" style="display:none">
    <div class="section-label" style="margin-top:32px">Your Certificate</div>
    <div class="cert-actions">
      <button class="btn-primary" id="downloadPngBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download PNG
      </button>
      <button class="btn-ghost" id="downloadPdfBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
        Download PDF
      </button>
    </div>
    <div class="cert-preview-wrap">
      <canvas id="certCanvas" width="1200" height="848"></canvas>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import { getTrackProgress } from "./js/curriculum.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  function toast(msg, type) {
    const c = document.getElementById("toastContainer");
    const t = document.createElement("div");
    t.className = "toast toast-" + (type||"info");
    t.innerHTML = "<span>" + msg + "</span>";
    c.appendChild(t);
    setTimeout(() => { t.style.opacity="0"; t.style.transition="opacity 0.3s"; setTimeout(()=>t.remove(),300); }, 3500);
  }

  const TRACKS = [
    { key:"html", label:"HTML",       icon:"⬡", color:"#e34c26", total:8 },
    { key:"css",  label:"CSS",        icon:"◈", color:"#264de4", total:6 },
    { key:"js",   label:"JavaScript", icon:"⬟", color:"#f7df1e", total:8 },
  ];

  let certUserName = "Developer";
  let certUserId = "XXXXXXXX";

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    certUserId = user.uid.slice(0,8).toUpperCase();

    let profile = {}, completed = [];
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) { profile = snap.data(); }
      completed = profile.completedLessons || [];
    } catch(e) { console.warn(e); }

    certUserName = profile.displayName || user.displayName || "Developer";

    // Build track status cards
    const statusEl = document.getElementById("certTrackStatus");
    let allComplete = true;
    TRACKS.forEach(t => {
      const p = getTrackProgress(t.key, completed);
      if (p.done < p.total) allComplete = false;
      const card = document.createElement("div");
      card.className = "cert-track-card" + (p.done === p.total ? " cert-track-done" : "");
      card.innerHTML =
        '<div class="cert-track-icon" style="color:' + t.color + '">' + t.icon + '</div>' +
        '<div class="cert-track-info">' +
          '<div class="cert-track-name">' + t.label + '</div>' +
          '<div class="xp-bar-track" style="margin-top:8px"><div class="xp-bar-fill" style="width:' + p.pct + '%;background:' + t.color + '"></div></div>' +
          '<div class="cert-track-lessons">' + p.done + ' / ' + p.total + ' lessons</div>' +
        '</div>' +
        '<div class="cert-track-badge">' + (p.done === p.total ? "✓ Complete" : p.pct + "%") + '</div>';
      statusEl.appendChild(card);
    });

    if (!allComplete) {
      document.getElementById("certLockedMsg").style.display = "flex";
    } else {
      document.getElementById("certSection").style.display = "block";
      // Small delay to let canvas render
      setTimeout(() => renderCertificate(certUserName, certUserId), 100);
      // Save cert record
      try {
        await setDoc(doc(db, "users", user.uid), {
          certificates: [{ id: "ENOVA-" + certUserId, issuedAt: new Date().toISOString(), type: "Full Stack Web" }]
        }, { merge: true });
      } catch(e) { console.warn("Could not save cert:", e); }
    }

    document.getElementById("logoutBtn").onclick = () => signOut(auth).then(() => window.location.href = "index.html");
    document.getElementById("downloadPngBtn").onclick = () => downloadPNG(certUserName);
    document.getElementById("downloadPdfBtn").onclick = () => downloadPDF();
  });

  function renderCertificate(name, uid) {
    const canvas = document.getElementById("certCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = 1200, H = 848;

    // Background
    ctx.fillStyle = "#050508";
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = "rgba(255,255,255,0.025)";
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // Glow orbs
    let g = ctx.createRadialGradient(200,200,0,200,200,400);
    g.addColorStop(0,"rgba(0,212,255,0.1)"); g.addColorStop(1,"transparent");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    g = ctx.createRadialGradient(1000,648,0,1000,648,400);
    g.addColorStop(0,"rgba(124,58,237,0.1)"); g.addColorStop(1,"transparent");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // Borders
    ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
    ctx.strokeRect(32,32,W-64,H-64);
    ctx.strokeStyle = "rgba(0,212,255,0.15)";
    ctx.strokeRect(48,48,W-96,H-96);

    // Top accent line
    const ag = ctx.createLinearGradient(48,0,W-48,0);
    ag.addColorStop(0,"transparent"); ag.addColorStop(0.3,"#00d4ff");
    ag.addColorStop(0.7,"#7c3aed"); ag.addColorStop(1,"transparent");
    ctx.strokeStyle = ag; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(48,48); ctx.lineTo(W-48,48); ctx.stroke();

    // Corner dots
    [[64,64],[W-64,64],[64,H-64],[W-64,H-64]].forEach(([cx,cy]) => {
      ctx.strokeStyle = "rgba(0,212,255,0.3)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,14,0,Math.PI*2); ctx.stroke();
    });

    // ENOVA Dev
    ctx.font = "bold 18px Arial"; ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.textAlign = "center"; ctx.fillText("ENOVA.dev", W/2, 110);

    // Title
    ctx.font = "12px 'Courier New'"; ctx.fillStyle = "#00d4ff";
    ctx.fillText("CERTIFICATE OF COMPLETION", W/2, 168);
    ctx.strokeStyle = "rgba(0,212,255,0.2)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2-160,183); ctx.lineTo(W/2+160,183); ctx.stroke();

    // This certifies that
    ctx.font = "20px Georgia,serif"; ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillText("This certifies that", W/2, 248);

    // Name
    ctx.font = "bold 68px Georgia,serif";
    const ng = ctx.createLinearGradient(W/2-300,0,W/2+300,0);
    ng.addColorStop(0,"#00d4ff"); ng.addColorStop(1,"#a78bfa");
    ctx.fillStyle = ng;
    ctx.fillText(name, W/2, 338);

    // Name underline
    const nw = ctx.measureText(name).width;
    const ug = ctx.createLinearGradient(W/2-nw/2,0,W/2+nw/2,0);
    ug.addColorStop(0,"transparent"); ug.addColorStop(0.5,"rgba(0,212,255,0.4)"); ug.addColorStop(1,"transparent");
    ctx.strokeStyle = ug; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2-nw/2,353); ctx.lineTo(W/2+nw/2,353); ctx.stroke();

    // has successfully completed
    ctx.font = "20px Georgia,serif"; ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillText("has successfully completed the", W/2, 408);

    // Course name
    ctx.font = "bold 36px Arial"; ctx.fillStyle = "#ffffff";
    ctx.fillText("Full Stack Web Development", W/2, 458);
    ctx.font = "16px Arial"; ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillText("HTML · CSS · JavaScript", W/2, 493);

    // Track badges
    [{label:"HTML",color:"#e34c26",x:W/2-180},{label:"CSS",color:"#264de4",x:W/2},{label:"JavaScript",color:"#f7df1e",x:W/2+180}]
    .forEach(b => {
      const bw=120,bh=36,bx=b.x-60,by=528;
      ctx.fillStyle = b.color+"22"; ctx.strokeStyle = b.color+"66"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,18); ctx.fill(); ctx.stroke();
      ctx.font="bold 13px 'Courier New'"; ctx.fillStyle=b.color;
      ctx.fillText(b.label,b.x,by+23);
    });

    // Divider
    ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(120,638); ctx.lineTo(W-120,638); ctx.stroke();

    // Date + ID
    const date = new Date().toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"});
    ctx.font="13px 'Courier New'"; ctx.fillStyle="rgba(255,255,255,0.25)";
    ctx.textAlign="left"; ctx.fillText("Issued: " + date, 120, 688);
    ctx.textAlign="right"; ctx.fillText("ID: ENOVA-" + uid, W-120, 688);

    // Footer
    ctx.textAlign="center"; ctx.font="bold 22px Georgia,serif"; ctx.fillStyle="rgba(255,255,255,0.5)";
    ctx.fillText("ENOVA Dev", W/2, 728);
    ctx.font="12px 'Courier New'"; ctx.fillStyle="rgba(255,255,255,0.2)";
    ctx.fillText("AI-Powered Learning Platform", W/2, 750);
  }

  function downloadPNG(name) {
    const canvas = document.getElementById("certCanvas");
    const a = document.createElement("a");
    a.download = "ENOVA-Dev-Certificate-" + name.replace(/\s/g,"-") + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
    toast("Certificate downloaded! 🎉", "success");
  }

  function downloadPDF() {
    const canvas = document.getElementById("certCanvas");
    const img = canvas.toDataURL("image/png");
    const win = window.open();
    if (!win) { toast("Allow popups to download PDF", "error"); return; }
    win.document.write('<html><head><title>ENOVA Dev Certificate</title><style>*{margin:0;padding:0}body{background:#000}img{width:100%;display:block}</style></head><body><img src="' + img + '"/><script>window.onload=function(){window.print()}<\/script></body></html>');
    toast("Opening print dialog...", "info");
  }
</script>
</body>
</html>
